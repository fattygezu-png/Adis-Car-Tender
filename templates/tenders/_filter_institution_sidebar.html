<div class="card shadow-sm border-0 p-3 bg-light">
    <h5 class="fw-bold mb-3 text-primary"><i class="bi bi-filter"></i> Filter Institutions</h5>
    
    <form method="GET" action="">
        <div class="mb-3">
            <label class="form-label small fw-bold text-dark">Search Institution</label>
            <input type="text" name="keyword" class="form-control form-control-sm" value="{{ request.GET.keyword }}" placeholder="Search institution name...">
        </div>

        <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold mb-2">Apply Filter</button>
        <a href="?" class="btn btn-outline-secondary btn-sm w-100">Reset Filter</a>
    </form>
</div>
