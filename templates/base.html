<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adis Car Tender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'user_dashboard' %}">Adis Car Tender</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
              {% if is_approved_user %}
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'tender_list' %}">Tenders</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'watchlist' %}">My Watchlist</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'winners_archive' %}">Winners Archive</a>
                </li>
              {% endif %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'user_dashboard' %}">Dashboard</a>
              </li>
              <li class="nav-item ms-lg-2">
                <a class="btn btn-outline-light btn-sm mt-1 mt-lg-0" href="{% url 'logout' %}">Sign Out</a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'login' %}">Login</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'register' %}">Register</a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
