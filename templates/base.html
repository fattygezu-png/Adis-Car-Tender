<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Adis Car Tender{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 font-sans antialiased">
    
    <!-- Navigation Bar -->
    <nav class="bg-[#111827] text-white shadow-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                
                <!-- Brand Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="{% url 'user_dashboard' %}" class="text-xl font-bold tracking-tight text-white hover:text-emerald-400 transition-colors">
                        Adis Car Tender
                    </a>
                </div>

                <!-- Nav Links -->
                <div class="hidden md:flex items-center space-x-6">
                    {% if user.is_authenticated %}
                        {% if is_approved_user %}
                            <a href="{% url 'tender_list' %}" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Tenders</a>
                            <a href="{% url 'watchlist' %}" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Watchlist</a>
                            <a href="{% url 'winners_archive' %}" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Winners Archive</a>
                        {% endif %}
                        <a href="{% url 'user_dashboard' %}" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Dashboard</a>
                        
                        <a href="{% url 'logout' %}" class="ml-4 px-4 py-2 border border-gray-600 rounded-xl text-sm font-medium text-gray-200 hover:bg-gray-800 hover:text-white transition-all">
                            Sign Out
                        </a>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Login</a>
                        <a href="{% url 'register' %}" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition-all shadow-sm">Register</a>
                    {% endif %}
                </div>

            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="py-8">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
