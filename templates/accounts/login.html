{% extends 'base.html' %}

{% block title %}Login - Adis Car Tender{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 mt-10">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-gray-100 p-8 sm:p-10 space-y-6">
        
        <!-- Heading -->
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                Welcome Back
            </h1>
            <p class="text-sm text-gray-500">
                Log in to access your Adis Car Tender account
            </p>
        </div>

        <!-- Login Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div class="space-y-1">
                <label for="username" class="block text-sm font-semibold text-gray-700">Username</label>
                <input type="text" id="username" name="username" value="{{ username_input }}" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm text-gray-900 transition-all">
            </div>

            <div class="space-y-1">
                <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm text-gray-900 transition-all">
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all text-base mt-2">
                Sign In
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center text-sm text-gray-500 pt-4 border-t border-gray-100">
            Don't have an account? 
            <a href="{% url 'register' %}" class="font-semibold text-emerald-600 hover:underline">
                Register here
            </a>
        </div>
    </div>
</div>
{% endblock %}
